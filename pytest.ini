# 仓库根 pytest 配置：仅供「多包合并跑」（pytest packages/core packages/server packages/runtime）
# 生效——单包各自 pyproject.toml 的 [tool.pytest.ini_options] 就近优先，不受本文件影响。
# 口径对齐三子包并集：asyncio_mode=auto（core/server 同款）+ basetemp 固定到项目内
# （Windows 下 %TEMP%\pytest-of-<user> 可能 ACL 损坏不可写，导致 tmp_path 用例
# PermissionError，与 packages/runtime/pyproject.toml 同一规避）。
[pytest]
addopts = -q --strict-markers --strict-config --basetemp=.pytest-tmp
asyncio_mode = auto
