# 跨域办公助手（一句话串起「数据分析 → 文档生成 → 制度问答」三个场景）
# 对齐：AGENTS.md §2/§3（声明式定制 / 写动作恒送审）+ PRD §6 任务拆解能力；
#       装载器 packages/runtime loader.py（扫 plugins/*/agent.yaml）。
#
# 设计意图：验证「员工一句话 → 一条 run 内跨域多步」的形态——工具白名单同时含
# 数据域（office.data.*）、文档域（office.report.generate）、知识域（kb.ask），
# 规则按场景编成链，步骤间的数字用 {steps[N].result.字段} 从上一步**真实出参**注入，
# 不硬编码（故报告数值一致率 100%，是跨步取数的实证而非演示数字）。
#
# 两条如实说明：
# 1. 每条链末步 kb.ask 的问句是固化的制度问题——这是**规则兜底链**的边界；
#    llm_mode: react 后自由目标由 qwen3:8b 逐步再规划（每步看真实出参决定下一步），
#    关键词命中走本文件 rules 快路径；LLM 不可用时未命中目标明确中文报错（不硬编造）。
# 2. llm 字段口径（2026-09-25 更新）：本地模型已切 qwen3:8b（.env LLM_PROVIDERS），
#    实测规划能返回合法 tool_calls 且含糊目标会回头追问不硬编造，故升为 LLM 主路径；
#    rules 保留作降级兜底（0.5b 时代结论见 AGENTS §6）。
# 3. 大模型串联（2026-09-26）：规则链文档步从 office.report.generate（纯模板直出）切到
#    office.doc.compose——素材传 {steps[*].result}（全部已完成步骤真实出参），成稿交
#    大模型、数字仍取真实台账（成稿侧另有数字溯源校验）；模型不可用降级素材原文直出。
name: office-assistant
description: 跨域办公助手：一句话串起数据查询、文档生成与制度问答（多步编排，数字全部来自上一步真实结果）
system_prompt: |
  你是跨域办公助手。回答中的每个数字必须来自工具返回的 JSON 字段，禁止推算与编造；
  缺数宁可留白，不补数。
  目标分流：问「制度/流程/标准/规定/怎么报销/如何申请」这类知识咨询时，用 kb.ask 检索制度原文回答；
  只有用户明确要发起/填写单据（如「报销」「帮我请两天假」）才用 office.approval.draft 出草稿追问缺项。
  需要产出文档时用 office.doc.compose：material 参数传全部已完成步骤的真实出参素材，
  让成稿基于真实数据而非编造。
tools:
  - office.data.query
  - office.data.analyze
  - office.data.export
  - office.data.chart_insight
  - office.data.query.save
  - office.data.query.list
  - office.data.query.run
  - office.mail.classify
  - office.mail.reply_draft
  - office.mail.action_items
  - office.mail.precheck
  - office.im.digest
  - office.hr.attendance
  - office.hr.checklist
  - office.resource.query
  - office.resource.book
  - office.project.query
  - office.task.decompose
  - office.task.commit
  - office.finance.reimburse
  - office.finance.expense
  - office.approval.draft
  - office.budget.query
  - office.desk.ticket
  - office.desk.tickets
  - office.report.generate
  - office.doc.compose
  - kb.ask
  - office.kb.search_unified
  - office.image.ask
max_steps: 8
llm: default
llm_mode: react
rules:
  # 规则〇〇：报销制度/流程咨询 → kb.ask 检索制度原文（必须排在裸「报销」起草规则之前，
  #           否则「报销制度」被子串抢走答成草稿追问）。只收报销类问法：规则问句是固化的，
  #           泛「制度/流程」类（请假/出差…）交给 LLM 主路径现场组织问句（system_prompt 已分流）
  - match: ["报销制度", "报销流程", "报销规定", "报销标准", "报销政策", "怎么报销", "如何报销", "报销审批"]
    steps:
      - tool: kb.ask
        args:
          query: 费用报销的标准、流程与审批权限
          top_k: 3
  # 规则〇A：报销进度 → 按人列单与在途金额（规则参数从一句话里抽不出人名，固定用演示
  #          台账身份并如实回显 person；点名某人/某单时由 LLM 主路径现场带参）
  - match: ["报销进度", "查报销", "报销到哪", "报销状态"]
    steps:
      - tool: office.finance.reimburse
        args:
          person: 张三
  # 规则〇B：裸「报销」→ 出报销单草稿并追问必填缺项（missing_fields/next_hint 原样呈现）
  - match: ["报销", "报销单"]
    steps:
      - tool: office.approval.draft
        args:
          kind: expense
          fields: {}
  # 规则一：经营数据复盘 → 查业绩台账 → 引披露口径 → 大模型成稿周报（素材=前两步真实出参，
  #         数字由成稿侧溯源校验；模型不可用降级素材原文直出，绝不编造）
  - match: ["经营复盘", "经营分析", "数据分析", "数据报告"]
    steps:
      - tool: office.data.query
        args:
          dataset: sales
          limit: 20
      - tool: kb.ask
        args:
          query: 经营数据对外披露需要哪些审批
          top_k: 3
      - tool: office.doc.compose
        args:
          title: 经营数据复盘
          instruction: 写成周报：先按台账查询真实数据汇总核心指标（命中记录数与全量记录数用素材原值），再附对外披露所需的审批要求
          material: "{steps[*].result}"
  # 规则二：工时统计 → 查工时台账 → 引加班认定口径 → 大模型成稿周报
  - match: ["工时统计", "工时周报", "工时复盘"]
    steps:
      - tool: office.data.query
        args:
          dataset: work
          limit: 20
      - tool: kb.ask
        args:
          query: 加班工时如何认定
          top_k: 3
      - tool: office.doc.compose
        args:
          title: 工时周报
          instruction: 写成周报：按工时台账真实数据汇总命中与全量记录数（用素材原值），并附加班工时认定口径
          material: "{steps[*].result}"
  # 规则三：考勤分析 → 查考勤台账 → 引请假制度 → 大模型成稿月报
  - match: ["考勤分析", "考勤统计", "出勤情况"]
    steps:
      - tool: office.data.query
        args:
          dataset: attendance
          limit: 20
      - tool: kb.ask
        args:
          query: 请假流程与考勤制度
          top_k: 3
      - tool: office.doc.compose
        args:
          title: 考勤统计报告
          instruction: 写成月报：按考勤台账真实数据汇总命中与全量记录数（用素材原值），并附请假流程与考勤制度要点
          material: "{steps[*].result}"