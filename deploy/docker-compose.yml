# 可选外部服务（ADR-0005）：Milvus 单机版（阶段二）+ Redis（阶段三）。
# 起法：docker compose -f deploy/docker-compose.yml up -d
# 停法：docker compose -f deploy/docker-compose.yml down
# 起后把 MILVUS_URI=http://127.0.0.1:19530 / REDIS_URL=redis://127.0.0.1:6379/0 写进 .env
# 并重启后端即为「增量灌库 + 过滤检索」与「跨进程向量缓存 + 调度环多实例租约锁」；
# 未配置或服务停掉时一律降级（检索 milvus → embedding 全量重算 → 字符 bigram；
# 缓存退进程内 LRU、调度环按无锁单实例语义），绝不 500。
# 两者互相独立：只用 Redis 也可只起 redis 一个服务（docker compose up -d redis）。
name: office-agent

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.23
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # SDK 接入端口
      - "9091:9091"     # 健康检查 / 指标
    depends_on:
      - etcd
      - minio

  # 缓存与租约锁专用：刻意**不开持久化**——重启即空是正确的（缓存不是真相源，
  # 作业与任务状态在 SQLite；丢了只是首批 embedding 重算一次）。
  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "6379:6379"

volumes:
  etcd-data:
  minio-data:
  milvus-data: