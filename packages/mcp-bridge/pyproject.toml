[project]
name = "office-agent-mcp-bridge"
version = "0.1.0"
description = "office-agent MCP 协议桥：以标准 MCP（JSON-RPC over HTTP）接入外部工具提供方"
requires-python = ">=3.11"
dependencies = [
    "office-agent-core",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["office_agent_mcp_bridge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "TID", "C901", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["office_agent_core", "office_agent_mcp_bridge"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["..", "../core"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
