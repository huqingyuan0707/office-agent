[project]
name = "office-agent-server"
version = "0.1.0"
description = "office-agent FastAPI 通用壳：登录鉴权 / 工具注册中心 / 任务 / 审批 / 治理状态"
requires-python = ">=3.11"
dependencies = [
    "office-agent-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["office_agent_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "TID", "C901", "RUF"]
ignore = [
    "E501",    # 行长交给 formatter
    "RUF001",  # 中文文案必需全角标点
    "RUF002",  # 中文 docstring 同上
    "RUF003",  # 中文注释同上
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"office_agent_server/api/**/*.py" = ["B008"]  # FastAPI 官方写法：Depends 写在参数默认值
"office_agent_server/rbac.py" = ["B008"]  # 同上（get_current_user / require_perm）

[tool.ruff.lint.isort]
known-first-party = ["office_agent_core", "office_agent_server"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# 内核与壳同仓并行开发：测试同时需要两个包可导入（装包后此项无副作用）
pythonpath = [".", "../core"]
asyncio_mode = "auto"
# --basetemp 固定到项目内：Windows 下 %TEMP%\pytest-of-<user> 可能不可写，导致 tmp_path 用例 PermissionError
addopts = "-q --strict-markers --strict-config --basetemp=.pytest-tmp"